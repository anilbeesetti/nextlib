name: Build nextlib

on:
  push:
    branches: [ main ]
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build nextlib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 https://dl.google.com/android/cli/latest/linux_x86_64/android -o "$HOME/.local/bin/android"
          chmod +x "$HOME/.local/bin/android"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Install native build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build nasm gperf python3-venv
          python3 -m venv "$RUNNER_TEMP/native-build-tools"
          "$RUNNER_TEMP/native-build-tools/bin/pip" install meson==1.12.0
          echo "$RUNNER_TEMP/native-build-tools/bin" >> "$GITHUB_PATH"

      - name: Check FFmpeg setup
        run: python3 ffmpeg/test_setup.py

      - name: Build Project with gradle
        run: ./gradlew assembleRelease

      - name: Check native packaging
        run: python3 ffmpeg/test_native_package.py

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nextlib-release
          if-no-files-found: error
          path: |
            media3ext/build/outputs/aar/media3ext-release.aar
            mediainfo/build/outputs/aar/mediainfo-release.aar
